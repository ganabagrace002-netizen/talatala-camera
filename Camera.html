<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Talatala QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 20px;
    }

    .instruction {
      background: #222;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      font-size: 18px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 20px;
      border-radius: 15px;
      overflow: hidden;
      background: black;
    }

    #status {
      padding: 18px;
      border-radius: 14px;
      margin: 15px 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .info {
      background: #333;
    }

    .success {
      background: #146c43;
    }

    .error {
      background: #842029;
    }

    .warning {
      background: #7a4614;
    }

    button {
      width: 100%;
      max-width: 500px;
      min-height: 60px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #dc3545;
      margin-top: 10px;
    }

  </style>

</head>


<body>

  <h1>📷 Talatala QR Scanner</h1>


  <div class="instruction">

    <b>LIVE CAMERA SCANNER</b>

    <br><br>

    Iharap ang cellphone camera sa QR Code ng learner.

    <br>

    Siguraduhing malinaw at nasa loob ng box ang QR Code.

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="info">

    ⏳ Starting camera...

  </div>


  <button
    id="closeButton"
    onclick="closeCamera()">

    ⛔ CLOSE CAMERA

  </button>


<script>


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let scanning = false;

let alreadyScanned = false;


/* =====================================================
   SHOW STATUS
===================================================== */

function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.className = type;

  status.innerHTML = message;

}


/* =====================================================
   CHECK PARENT WINDOW
===================================================== */

function checkParentWindow() {

  if (
    !window.opener ||
    window.opener.closed
  ) {

    showStatus(
      "❌ Walang Attendance page na nakakonekta." +
      "<br><br>" +
      "Please CLOSE this camera page." +
      "<br>" +
      "Then open the camera using the " +
      "<b>START LIVE CAMERA</b> button " +
      "inside the Attendance System.",
      "error"
    );

    return false;
  }

  return true;
}


/* =====================================================
   START CAMERA
===================================================== */

function startCamera() {

  if (scanning) {
    return;
  }


  if (!checkParentWindow()) {
    return;
  }


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showStatus(
      "❌ QR scanner library failed to load." +
      "<br>Please check your internet connection.",
      "error"
    );

    return;
  }


  scanning = true;


  showStatus(
    "📷 Camera starting..." +
    "<br>Please allow camera permission.",
    "info"
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const minSize =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

      return {

        width:
          Math.floor(
            minSize * 0.70
          ),

        height:
          Math.floor(
            minSize * 0.70
          )

      };

    },

    aspectRatio: 1.0

  };


  scanner
    .start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      config,

      onScanSuccess,

      onScanError

    )

    .then(
      function() {

        showStatus(
          "📷 CAMERA READY" +
          "<br><br>" +
          "Iharap ang camera sa QR Code.",
          "info"
        );

      }
    )

    .catch(
      function(error) {

        console.error(
          "Camera start error:",
          error
        );


        scanning = false;


        showStatus(
          "❌ HINDI MABUKSAN ANG CAMERA." +
          "<br><br>" +
          "Please allow camera permission " +
          "and try again.",
          "error"
        );

      }
    );

}


/* =====================================================
   QR SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (alreadyScanned) {
    return;
  }


  alreadyScanned = true;


  const learnerId =
    String(
      decodedText || ""
    ).trim();


  console.log(
    "QR detected:",
    learnerId
  );


  if (!learnerId) {

    alreadyScanned = false;

    return;
  }


  showStatus(
    "✅ QR CODE DETECTED!" +
    "<br><br>" +
    "<b>Learner ID:</b> " +
    learnerId +
    "<br><br>" +
    "⏳ Sending to Attendance System...",
    "success"
  );


  stopScanner();


  sendLearnerId(
    learnerId
  );

}


/* =====================================================
   QR SCAN ERROR
===================================================== */

function onScanError(errorMessage) {

  /*
     Normal QR scanning produces many
     "not found" messages.

     We intentionally do nothing here.
  */

}


/* =====================================================
   SEND LEARNER ID TO APPS SCRIPT PAGE
===================================================== */

function sendLearnerId(
  learnerId
) {

  console.log(
    "Sending learner ID:",
    learnerId
  );


  /* -----------------------------------------------
     CHECK PARENT WINDOW
  ------------------------------------------------ */

  if (
    !window.opener ||
    window.opener.closed
  ) {

    showStatus(
      "❌ Hindi maipasa ang Learner ID." +
      "<br><br>" +
      "Walang Attendance System window." +
      "<br><br>" +
      "Please close this page and open the camera " +
      "from the Attendance System.",
      "error"
    );

    return;
  }


  /* -----------------------------------------------
     SEND MESSAGE TO INDEX.HTML
  ------------------------------------------------ */

  window.opener.postMessage(

    {
      type:
        "TALATALA_QR_RESULT",

      learnerId:
        learnerId
    },

    "*"

  );


  showStatus(
    "✅ Learner ID sent!" +
    "<br><br>" +
    "Returning to Attendance System...",
    "success"
  );


  /* -----------------------------------------------
     CLOSE CAMERA WINDOW
  ------------------------------------------------ */

  setTimeout(
    function() {

      try {

        window.close();

      } catch (e) {

        console.log(e);

      }

    },
    700
  );

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    scanner
      .stop()

      .then(
        function() {

          scanning = false;

        }
      )

      .catch(
        function(error) {

          console.log(
            "Scanner stop error:",
            error
          );

          scanning = false;

        }
      );

  } catch (error) {

    console.log(error);

    scanning = false;

  }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera() {

  stopScanner();


  try {

    window.close();

  } catch (e) {

    console.log(e);

  }

}


/* =====================================================
   START WHEN PAGE LOADS
===================================================== */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      startCamera,
      500
    );

  }
);

</script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talatala Learner Attendance</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h2 {
      margin: 5px 0;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 20px;
    }

    /* MAIN BUTTON */
    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin: 8px auto;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* SCAN QR BUTTON */
    #scanQRButton {
      background: #2563eb;
      color: white;
    }

    /* START CAMERA */
    #startCameraButton {
      display: none;
      background: #16a34a;
      color: white;
    }

    /* STOP CAMERA */
    #stopCameraButton {
      display: none;
      background: #dc2626;
      color: white;
    }

    /* RECORD */
    #recordButton {
      display: none;
      background: #059669;
      color: white;
    }

    /* SCAN AGAIN */
    #scanAgainButton {
      display: none;
      background: #7c3aed;
      color: white;
    }

    /* CAMERA AREA */
    #cameraArea {
      display: none;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    /* STATUS */
    #status {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      background: #1f2937;
      font-size: 16px;
      white-space: pre-line;
    }

    .success {
      background: #166534 !important;
    }

    .error {
      background: #991b1b !important;
    }

    .warning {
      background: #92400e !important;
    }

    .loading {
      background: #1e40af !important;
    }

    /* LEARNER INFORMATION */
    #learnerBox {
      display: none;
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: white;
      color: #111827;
      border-radius: 15px;
      text-align: left;
    }

    #learnerBox h3 {
      text-align: center;
      margin-top: 0;
    }

    .info {
      margin: 10px 0;
      font-size: 17px;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>📚 Talatala Learner Attendance</h2>

  <div class="subtitle">
    QR Code Attendance System
  </div>


  <!-- ========================================= -->
  <!-- STEP 1: SCAN QR CODE BUTTON -->
  <!-- ========================================= -->

  <button id="scanQRButton" onclick="openScanner()">
    📷 SCAN QR CODE
  </button>


  <!-- ========================================= -->
  <!-- CAMERA AREA -->
  <!-- ========================================= -->

  <div id="cameraArea">

    <div id="reader"></div>

    <!-- START CAMERA -->
    <button
      id="startCameraButton"
      onclick="startCamera()">
      ▶ START CAMERA
    </button>

    <!-- STOP CAMERA -->
    <button
      id="stopCameraButton"
      onclick="stopCamera()">
      ⏹ STOP CAMERA
    </button>

  </div>


  <!-- ========================================= -->
  <!-- STATUS -->
  <!-- ========================================= -->

  <div id="status">
    Ready. Press SCAN QR CODE.
  </div>


  <!-- ========================================= -->
  <!-- LEARNER INFORMATION -->
  <!-- ========================================= -->

  <div id="learnerBox">

    <h3>👤 Learner Information</h3>

    <div class="info">
      <span class="label">Learner ID:</span>
      <span id="learnerIdDisplay">-</span>
    </div>

  </div>


  <!-- ========================================= -->
  <!-- RECORD ATTENDANCE -->
  <!-- ========================================= -->

  <button
    id="recordButton"
    onclick="recordAttendance()">

    🟢 RECORD ATTENDANCE

  </button>


  <!-- ========================================= -->
  <!-- SCAN AGAIN -->
  <!-- ========================================= -->

  <button
    id="scanAgainButton"
    onclick="scanAgain()">

    🔄 SCAN AGAIN

  </button>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ===================================================== */

const ATTENDANCE_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzn0z2dIIE74T1pEa6PptXkFY-6smpKB0Cj8UP32vwxkHAYvsGi9K-iM-EOF4w0LNc1/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let scannedLearnerId = "";

let cameraRunning = false;

let alreadyScanned = false;

let recording = false;


/* =====================================================
   STATUS FUNCTION
   ===================================================== */

function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className = "";

  if (type) {
    status.classList.add(type);
  }

}


/* =====================================================
   STEP 1
   OPEN SCANNER
   ===================================================== */

function openScanner() {

  /*
   * Show camera area
   */

  document.getElementById("cameraArea").style.display =
    "block";


  /*
   * Hide SCAN QR button
   */

  document.getElementById("scanQRButton").style.display =
    "none";


  /*
   * Show START CAMERA button
   */

  document.getElementById("startCameraButton").style.display =
    "block";


  /*
   * Hide STOP button initially
   */

  document.getElementById("stopCameraButton").style.display =
    "none";


  showStatus(
    "📷 Camera is ready.\n\nPress START CAMERA.",
    "warning"
  );

}


/* =====================================================
   START CAMERA
   ===================================================== */

function startCamera() {

  /*
   * Prevent duplicate camera
   */

  if (cameraRunning) {
    return;
  }


  /*
   * Reset scanning
   */

  alreadyScanned = false;


  showStatus(
    "📷 Starting camera...\n\nPlease allow camera permission.",
    "loading"
  );


  /*
   * Create QR scanner
   */

  scanner = new Html5Qrcode("reader");


  /*
   * Start rear camera
   */

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanError

  )

  .then(function () {

    cameraRunning = true;


    /*
     * Hide START
     */

    document.getElementById(
      "startCameraButton"
    ).style.display = "none";


    /*
     * Show STOP
     */

    document.getElementById(
      "stopCameraButton"
    ).style.display = "block";


    showStatus(
      "📷 CAMERA RUNNING\n\nItapat ang QR code ng learner.",
      "success"
    );

  })

  .catch(function (error) {

    console.error(error);

    cameraRunning = false;

    showStatus(
      "❌ Hindi mabuksan ang camera.\n\nPlease allow camera permission and try again.",
      "error"
    );

  });

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

function stopCamera() {

  if (!scanner || !cameraRunning) {

    showStatus(
      "Camera is not running.",
      "warning"
    );

    return;

  }


  scanner.stop()

    .then(function () {

      cameraRunning = false;


      /*
       * Hide STOP
       */

      document.getElementById(
        "stopCameraButton"
      ).style.display = "none";


      /*
       * Show START
       */

      document.getElementById(
        "startCameraButton"
      ).style.display = "block";


      showStatus(
        "⏹ CAMERA STOPPED",
        "warning"
      );

    })

    .catch(function (error) {

      console.error(error);

      cameraRunning = false;

    });

}


/* =====================================================
   QR SCAN SUCCESS
   ===================================================== */

function onScanSuccess(decodedText) {

  /*
   * Prevent multiple scans
   */

  if (alreadyScanned) {
    return;
  }


  alreadyScanned = true;


  /*
   * Get learner ID
   */

  scannedLearnerId =
    String(decodedText).trim();


  console.log(
    "QR detected:",
    scannedLearnerId
  );


  /*
   * STOP CAMERA AUTOMATICALLY
   */

  if (scanner && cameraRunning) {

    scanner.stop()

      .then(function () {

        cameraRunning = false;


        document.getElementById(
          "stopCameraButton"
        ).style.display = "none";


        document.getElementById(
          "startCameraButton"
        ).style.display = "none";

      })

      .catch(function (error) {

        console.log(error);

      });

  }


  /*
   * DISPLAY LEARNER ID
   */

  document.getElementById(
    "learnerIdDisplay"
  ).textContent =
    scannedLearnerId;


  /*
   * SHOW LEARNER BOX
   */

  document.getElementById(
    "learnerBox"
  ).style.display = "block";


  /*
   * SHOW RECORD BUTTON
   */

  document.getElementById(
    "recordButton"
  ).style.display = "block";


  /*
   * SHOW SCAN AGAIN
   */

  document.getElementById(
    "scanAgainButton"
  ).style.display = "block";


  /*
   * STATUS
   */

  showStatus(

    "✅ QR CODE DETECTED!\n\n" +
    "Learner ID: " +
    scannedLearnerId +
    "\n\n" +
    "Press RECORD ATTENDANCE.",

    "success"

  );

}


/* =====================================================
   QR SCAN ERROR
   ===================================================== */

function onScanError(errorMessage) {

  /*
   * Normal scanning errors are ignored.
   */

}


/* =====================================================
   RECORD ATTENDANCE
   ===================================================== */

function recordAttendance() {

  /*
   * Prevent duplicate recording
   */

  if (recording) {
    return;
  }


  /*
   * Check learner ID
   */

  if (!scannedLearnerId) {

    showStatus(
      "❌ Walang learner ID na na-scan.",
      "error"
    );

    return;

  }


  recording = true;


  /*
   * Disable record button
   */

  const recordButton =
    document.getElementById(
      "recordButton"
    );


  recordButton.disabled = true;


  recordButton.textContent =
    "⏳ RECORDING...";


  showStatus(
    "⏳ Saving attendance...\n\nPlease wait...",
    "loading"
  );


  /*
   * SEND TO GOOGLE APPS SCRIPT
   */

  const url =
    ATTENDANCE_WEB_APP_URL +
    "?learnerId=" +
    encodeURIComponent(
      scannedLearnerId
    );


  /*
   * Open Apps Script
   */

  window.location.href = url;

}


/* =====================================================
   SCAN AGAIN
   ===================================================== */

function scanAgain() {

  /*
   * Reset variables
   */

  scannedLearnerId = "";

  alreadyScanned = false;

  recording = false;


  /*
   * Clear learner ID
   */

  document.getElementById(
    "learnerIdDisplay"
  ).textContent = "-";


  /*
   * Hide learner information
   */

  document.getElementById(
    "learnerBox"
  ).style.display = "none";


  /*
   * Hide record button
   */

  document.getElementById(
    "recordButton"
  ).style.display = "none";


  /*
   * Hide scan again
   */

  document.getElementById(
    "scanAgainButton"
  ).style.display = "none";


  /*
   * Reset record button
   */

  const recordButton =
    document.getElementById(
      "recordButton"
    );


  recordButton.disabled = false;


  recordButton.textContent =
    "🟢 RECORD ATTENDANCE";


  /*
   * Show SCAN QR CODE button
   */

  document.getElementById(
    "scanQRButton"
  ).style.display = "block";


  /*
   * Hide camera area
   */

  document.getElementById(
    "cameraArea"
  ).style.display = "none";


  showStatus(
    "Ready.\n\nPress SCAN QR CODE.",
    "success"
  );

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.onload = function () {

  showStatus(
    "Ready.\n\nPress SCAN QR CODE."
  );

};


</script>

</body>
</html>

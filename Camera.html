<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Talatala Learner Attendance</title>

  <!-- QR SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }


    h2 {
      margin: 5px 0;
    }


    .subtitle {
      color: #d1d5db;
      margin-bottom: 20px;
    }


    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin: 8px auto;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }


    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    /* SCAN BUTTON */

    #scanQRButton {
      background: #2563eb;
      color: white;
    }


    /* START CAMERA */

    #startCameraButton {
      display: none;
      background: #16a34a;
      color: white;
    }


    /* STOP CAMERA */

    #stopCameraButton {
      display: none;
      background: #dc2626;
      color: white;
    }


    /* CAMERA AREA */

    #cameraArea {
      display: none;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }


    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }


    /* STATUS */

    #status {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      background: #1f2937;
      font-size: 16px;
      white-space: pre-line;
    }


    .success {
      background: #166534 !important;
    }


    .error {
      background: #991b1b !important;
    }


    .warning {
      background: #92400e !important;
    }


    .loading {
      background: #1e40af !important;
    }


    /* LAST SCANNED LEARNER */

    #learnerBox {
      display: none;
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: white;
      color: #111827;
      border-radius: 15px;
      text-align: left;
    }


    #learnerBox h3 {
      text-align: center;
      margin-top: 0;
    }


    .info {
      margin: 10px 0;
      font-size: 17px;
    }


    .label {
      font-weight: bold;
    }


    /* CONTINUOUS SCANNING INDICATOR */

    #continuousIndicator {
      display: none;
      max-width: 500px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 10px;
      background: #065f46;
      font-weight: bold;
    }


    /* HIDDEN REQUEST FRAME */

    #attendanceFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }

  </style>

</head>


<body>


  <h2>
    📚 Talatala Learner Attendance
  </h2>


  <div class="subtitle">
    Automatic QR Attendance System
  </div>


  <!-- ========================================= -->
  <!-- SCAN QR CODE -->
  <!-- ========================================= -->

  <button
    id="scanQRButton"
    onclick="openScanner()"
  >

    📷 SCAN QR CODE

  </button>


  <!-- ========================================= -->
  <!-- CAMERA -->
  <!-- ========================================= -->

  <div id="cameraArea">

    <div id="reader"></div>


    <!-- START -->

    <button
      id="startCameraButton"
      onclick="startCamera()"
    >

      ▶ START CAMERA

    </button>


    <!-- STOP -->

    <button
      id="stopCameraButton"
      onclick="stopCamera()"
    >

      ⏹ STOP CAMERA

    </button>

  </div>


  <!-- ========================================= -->
  <!-- CONTINUOUS SCANNING -->
  <!-- ========================================= -->

  <div id="continuousIndicator">

    🔄 CONTINUOUS SCANNING ACTIVE

  </div>


  <!-- ========================================= -->
  <!-- STATUS -->
  <!-- ========================================= -->

  <div id="status">

    Ready.

    Press SCAN QR CODE.

  </div>


  <!-- ========================================= -->
  <!-- LAST LEARNER -->
  <!-- ========================================= -->

  <div id="learnerBox">

    <h3>
      👤 Last Scanned Learner
    </h3>


    <div class="info">

      <span class="label">
        Learner ID:
      </span>

      <span id="learnerIdDisplay">
        -
      </span>

    </div>


    <div class="info">

      <span class="label">
        Attendance:
      </span>

      <span id="attendanceStatus">
        -
      </span>

    </div>

  </div>


  <!-- ========================================= -->
  <!-- HIDDEN APPS SCRIPT REQUEST FRAME -->
  <!-- ========================================= -->

  <iframe
    id="attendanceFrame"
    name="attendanceFrame"
    title="Attendance Request">
  </iframe>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT WEB APP
   ===================================================== */

const ATTENDANCE_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzn0z2dIIE74T1pEa6PptXkFY-6smpKB0Cj8UP32vwxkHAYvsGi9K-iM-EOF4w0LNc1/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let cameraRunning = false;

let alreadyProcessing = false;


/*
 * Prevent duplicate scanning
 */

let lastScannedId = "";

let lastScanTime = 0;


/*
 * Same QR cooldown
 */

const SAME_QR_COOLDOWN = 5000;


/*
 * Time to allow Apps Script to process
 * before camera is ready for another learner.
 */

const ATTENDANCE_PROCESS_DELAY = 2500;


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(message, type) {

  const status =
    document.getElementById("status");


  status.textContent = message;


  status.className = "";


  if (type) {

    status.classList.add(type);

  }

}


/* =====================================================
   EXTRACT LEARNER ID
   ===================================================== */

function extractLearnerId(decodedText) {

  let value =
    String(decodedText || "").trim();


  if (!value) {

    return "";

  }


  /*
   * CASE 1
   * QR contains plain Learner ID
   *
   * Example:
   * 1
   */

  if (
    /^[A-Za-z0-9_-]+$/.test(value)
  ) {

    return value;

  }


  /*
   * CASE 2
   * QR contains:
   *
   * ?learnerId=1
   */

  try {

    let url =
      new URL(value);


    let learnerId =
      url.searchParams.get(
        "learnerId"
      );


    if (learnerId) {

      return String(
        learnerId
      ).trim();

    }

  }

  catch (error) {

    /*
     * Not a URL.
     * Continue below.
     */

  }


  /*
   * CASE 3
   * Search manually for learnerId=
   */

  const match =
    value.match(
      /learnerId=([^&\s]+)/i
    );


  if (match && match[1]) {

    return decodeURIComponent(
      match[1]
    ).trim();

  }


  /*
   * FALLBACK
   */

  return value;

}


/* =====================================================
   OPEN SCANNER
   ===================================================== */

function openScanner() {

  document.getElementById(
    "cameraArea"
  ).style.display = "block";


  document.getElementById(
    "scanQRButton"
  ).style.display = "none";


  document.getElementById(
    "startCameraButton"
  ).style.display = "block";


  document.getElementById(
    "stopCameraButton"
  ).style.display = "none";


  showStatus(
    "📷 Camera ready.\n\n" +
    "Press START CAMERA.",
    "warning"
  );

}


/* =====================================================
   START CAMERA
   ===================================================== */

function startCamera() {

  if (cameraRunning) {

    return;

  }


  showStatus(
    "📷 Starting camera...\n\n" +
    "Please allow camera permission.",
    "loading"
  );


  try {

    scanner =
      new Html5Qrcode("reader");

  }

  catch (error) {

    console.error(error);


    showStatus(
      "❌ Unable to initialize QR scanner.\n\n" +
      error,
      "error"
    );


    return;

  }


  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    onScanSuccess,

    onScanError

  )

  .then(function () {

    cameraRunning = true;


    document.getElementById(
      "startCameraButton"
    ).style.display = "none";


    document.getElementById(
      "stopCameraButton"
    ).style.display = "block";


    document.getElementById(
      "continuousIndicator"
    ).style.display = "block";


    showStatus(
      "📷 CAMERA RUNNING\n\n" +
      "Scan the learner QR code.\n\n" +
      "Attendance will be recorded automatically.",
      "success"
    );

  })

  .catch(function (error) {

    console.error(
      "Camera error:",
      error
    );


    cameraRunning = false;


    /*
     * Try again without exact constraint.
     * Some Android phones reject exact environment.
     */

    startCameraFallback();

  });

}


/* =====================================================
   CAMERA FALLBACK
   ===================================================== */

function startCameraFallback() {

  showStatus(
    "📷 Trying camera again...\n\n" +
    "Please allow camera permission.",
    "loading"
  );


  if (scanner) {

    try {

      scanner.clear();

    }

    catch (e) {

    }

  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    onScanSuccess,

    onScanError

  )

  .then(function () {

    cameraRunning = true;


    document.getElementById(
      "startCameraButton"
    ).style.display = "none";


    document.getElementById(
      "stopCameraButton"
    ).style.display = "block";


    document.getElementById(
      "continuousIndicator"
    ).style.display = "block";


    showStatus(
      "📷 CAMERA RUNNING\n\n" +
      "Scan the learner QR code.\n\n" +
      "Attendance will be recorded automatically.",
      "success"
    );

  })

  .catch(function (error) {

    console.error(
      "Camera fallback error:",
      error
    );


    cameraRunning = false;


    showStatus(
      "❌ Hindi mabuksan ang camera.\n\n" +
      "Please allow camera permission and try again.\n\n" +
      "Camera error:\n" +
      error,
      "error"
    );

  });

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

function stopCamera() {

  if (!scanner || !cameraRunning) {

    return;

  }


  scanner.stop()

    .then(function () {

      cameraRunning = false;


      document.getElementById(
        "stopCameraButton"
      ).style.display = "none";


      document.getElementById(
        "startCameraButton"
      ).style.display = "block";


      document.getElementById(
        "continuousIndicator"
      ).style.display = "none";


      showStatus(
        "⏹ CAMERA STOPPED",
        "warning"
      );

    })

    .catch(function (error) {

      console.error(error);

      cameraRunning = false;

    });

}


/* =====================================================
   QR SCANNED
   ===================================================== */

function onScanSuccess(decodedText) {

  /*
   * Convert QR result into Learner ID.
   */

  const learnerId =
    extractLearnerId(
      decodedText
    );


  if (!learnerId) {

    return;

  }


  /*
   * Prevent duplicate scan.
   */

  const now =
    Date.now();


  if (

    learnerId === lastScannedId &&

    (now - lastScanTime) <
      SAME_QR_COOLDOWN

  ) {

    return;

  }


  /*
   * Another learner is currently
   * being processed.
   */

  if (alreadyProcessing) {

    return;

  }


  alreadyProcessing = true;


  lastScannedId =
    learnerId;


  lastScanTime =
    now;


  /*
   * Display learner ID.
   */

  document.getElementById(
    "learnerIdDisplay"
  ).textContent =
    learnerId;


  document.getElementById(
    "attendanceStatus"
  ).textContent =
    "Saving...";


  document.getElementById(
    "learnerBox"
  ).style.display =
    "block";


  showStatus(
    "✅ QR DETECTED\n\n" +
    "Learner ID: " +
    learnerId +
    "\n\n" +
    "⏳ Recording attendance...",
    "loading"
  );


  /*
   * Send attendance.
   */

  recordAttendanceAutomatically(
    learnerId
  );

}


/* =====================================================
   AUTOMATIC ATTENDANCE
   ===================================================== */

function recordAttendanceAutomatically(
  learnerId
) {

  learnerId =
    String(
      learnerId || ""
    ).trim();


  if (!learnerId) {

    alreadyProcessing =
      false;


    showStatus(
      "❌ WALANG LEARNER ID.\n\n" +
      "Please scan the QR code again.",
      "error"
    );


    return;

  }


  /*
   * Build Apps Script URL.
   */

  const url =
    ATTENDANCE_WEB_APP_URL +
    "?learnerId=" +
    encodeURIComponent(
      learnerId
    );


  /*
   * IMPORTANT:
   *
   * We DO NOT use:
   *
   * window.location.href
   *
   * because that leaves the camera page
   * and opens the Apps Script response page.
   *
   * Instead, we submit the GET request
   * through a hidden iframe.
   */


  showStatus(
    "⏳ SAVING ATTENDANCE...\n\n" +
    "Learner ID: " +
    learnerId +
    "\n\n" +
    "Please wait...",
    "loading"
  );


  document.getElementById(
    "attendanceStatus"
  ).textContent =
    "Saving attendance...";


  /*
   * Create a temporary form.
   *
   * The form performs a GET request to
   * Google Apps Script.
   */

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "GET";


  form.action =
    ATTENDANCE_WEB_APP_URL;


  form.target =
    "attendanceFrame";


  form.style.display =
    "none";


  /*
   * Learner ID parameter.
   */

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "hidden";


  input.name =
    "learnerId";


  input.value =
    learnerId;


  form.appendChild(
    input
  );


  document.body.appendChild(
    form
  );


  /*
   * Submit to hidden iframe.
   */

  try {

    form.submit();

  }

  catch (error) {

    console.error(
      "Attendance submission error:",
      error
    );


    document.body.removeChild(
      form
    );


    alreadyProcessing =
      false;


    document.getElementById(
      "attendanceStatus"
    ).textContent =
      "Error";


    showStatus(
      "❌ ATTENDANCE ERROR\n\n" +
      "Unable to send the attendance request.\n\n" +
      error,
      "error"
    );


    return;

  }


  /*
   * Remove temporary form.
   */

  setTimeout(
    function () {

      try {

        document.body.removeChild(
          form
        );

      }

      catch (e) {

      }

    },
    1000
  );


  /*
   * Apps Script is now processing
   * the attendance in the background.
   *
   * We intentionally do not read the
   * iframe response because the iframe
   * belongs to the Google Apps Script
   * domain.
   */


  setTimeout(
    function () {

      document.getElementById(
        "attendanceStatus"
      ).textContent =
        "Attendance request sent";


      showStatus(
        "✅ ATTENDANCE REQUEST SENT\n\n" +
        "Learner ID: " +
        learnerId +
        "\n\n" +
        "The attendance record is being processed.\n\n" +
        "📷 Ready for the next learner.",
        "success"
      );


      /*
       * Allow next learner scan.
       */

      alreadyProcessing =
        false;


      /*
       * Keep camera running.
       */

      if (cameraRunning) {

        document.getElementById(
          "continuousIndicator"
        ).style.display =
          "block";

      }

    },
    ATTENDANCE_PROCESS_DELAY
  );

}


/* =====================================================
   QR SCAN ERROR
   ===================================================== */

function onScanError(errorMessage) {

  /*
   * Normal QR scanning errors are ignored.
   */

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.onload =
  function () {

    showStatus(
      "Ready.\n\n" +
      "Press SCAN QR CODE."
    );

  };


</script>


</body>
</html>

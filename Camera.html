<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Talatala QR Scanner</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#status {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #1f2937;
  font-size: 16px;
}

.error {
  background: #991b1b !important;
}

</style>

</head>


<body>

<h2>📷 Talatala QR Scanner</h2>

<p>
Itapat ang QR code ng learner sa camera.
</p>

<div id="reader"></div>

<div id="status">
Preparing camera...
</div>


<script>

const ATTENDANCE_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzn0z2dIIE74T1pEa6PptXkFY-6smpKB0Cj8UP32vwxkHAYvsGi9K-iM-EOF4w0LNc1/exec";


let scanner = null;

let alreadyScanned = false;


/************************************************
 * STATUS
 ************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "";


  if (type) {

    status.classList.add(
      type
    );
  }
}


/************************************************
 * START CAMERA
 ************************************************/

function startCamera() {

  showStatus(
    "📷 Starting camera..."
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    onScanError

  )

  .then(function() {

    showStatus(
      "📷 Camera ready. Scan learner QR."
    );

  })

  .catch(function(error) {

    console.error(
      error
    );


    showStatus(

      "❌ Hindi mabuksan ang camera. " +
      "Please allow camera permission.",

      "error"

    );

  });

}


/************************************************
 * QR SUCCESS
 ************************************************/

function onScanSuccess(
  decodedText
) {

  if (
    alreadyScanned
  ) {

    return;
  }


  alreadyScanned =
    true;


  const learnerId =
    String(
      decodedText
    ).trim();


  showStatus(

    "✅ QR detected: " +
    learnerId +
    "\nSaving attendance..."

  );


  if (scanner) {

    scanner.stop()
      .catch(function(error) {

        console.log(
          error
        );

      });
  }


  /**********************************************
   * SEND LEARNER ID TO GOOGLE APPS SCRIPT
   **********************************************/

  const url =

    ATTENDANCE_WEB_APP_URL +

    "?learnerId=" +

    encodeURIComponent(
      learnerId
    );


  window.location.href =
    url;
}


/************************************************
 * QR ERROR
 ************************************************/

function onScanError(
  errorMessage
) {

  /*
   * Normal QR scanning errors are ignored.
   */
}


/************************************************
 * START
 ************************************************/

window.onload =
  function() {

    startCamera();

  };

</script>

</body>

</html>

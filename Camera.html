<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Talatala QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 10px 0 20px;
}

.instruction {
  background: #222;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  font-size: 18px;
  line-height: 1.5;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 20px;
  border-radius: 15px;
  overflow: hidden;
  background: black;
}

#status {
  padding: 18px;
  border-radius: 14px;
  margin: 15px 0;
  font-size: 17px;
  line-height: 1.5;
}

.info {
  background: #333;
}

.success {
  background: #146c43;
}

.error {
  background: #842029;
}

.warning {
  background: #7a4614;
}

button {
  width: 100%;
  max-width: 500px;
  min-height: 60px;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: #dc3545;
  margin-top: 10px;
}

</style>

</head>

<body>

<h1>📷 Talatala QR Scanner</h1>

<div class="instruction">

<b>LIVE CAMERA SCANNER</b>

<br><br>

Iharap ang cellphone camera sa QR Code ng learner.

<br><br>

Kapag nabasa ang QR Code,
automatic itong ipapasa sa Attendance System.

</div>

<div id="reader"></div>

<div id="status" class="info">

⏳ Starting camera...

</div>

<button id="closeButton"
        onclick="closeCamera()">

⛔ CLOSE CAMERA

</button>


<script>

/* =====================================================
   SETTINGS
===================================================== */

/*
 * IMPORTANT:
 * ILAGAY DITO ANG ACTUAL GOOGLE APPS SCRIPT
 * WEB APP URL NG TALATALA ATTENDANCE SYSTEM.
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXXXXXXXXX/exec
 */

const ATTENDANCE_WEB_APP_URL =
  "PASTE-YOUR-GOOGLE-WEB-APP-URL-HERE";


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let scanning = false;

let alreadyScanned = false;


/* =====================================================
   SHOW STATUS
===================================================== */

function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.className = type;

  status.innerHTML = message;

}


/* =====================================================
   CHECK WEB APP URL
===================================================== */

function checkWebAppURL() {

  if (
    !ATTENDANCE_WEB_APP_URL ||
    ATTENDANCE_WEB_APP_URL.indexOf(
      "script.google.com"
    ) === -1
  ) {

    showStatus(

      "❌ Hindi pa naka-configure ang Attendance Web App URL." +

      "<br><br>" +

      "Pakilagay ang Google Apps Script Web App URL " +

      "sa Camera.html.",

      "error"

    );

    return false;
  }

  return true;

}


/* =====================================================
   START CAMERA
===================================================== */

function startCamera() {

  if (scanning) {
    return;
  }

  if (!checkWebAppURL()) {
    return;
  }

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showStatus(

      "❌ Hindi nag-load ang QR scanner." +

      "<br><br>" +

      "Please check your internet connection.",

      "error"

    );

    return;
  }


  scanning = true;


  showStatus(

    "📷 CAMERA STARTING..." +

    "<br><br>" +

    "Please allow camera permission.",

    "info"

  );


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const minSize =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

      return {

        width:
          Math.floor(
            minSize * 0.70
          ),

        height:
          Math.floor(
            minSize * 0.70
          )

      };

    },

    aspectRatio: 1.0

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanError

  )

  .then(

    function() {

      showStatus(

        "📷 CAMERA READY" +

        "<br><br>" +

        "Iharap ang camera sa QR Code.",

        "info"

      );

    }

  )

  .catch(

    function(error) {

      console.error(
        "Camera error:",
        error
      );

      scanning = false;

      showStatus(

        "❌ HINDI MABUKSAN ANG CAMERA." +

        "<br><br>" +

        "Please allow camera permission " +

        "and try again.",

        "error"

      );

    }

  );

}


/* =====================================================
   QR SUCCESS
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (alreadyScanned) {
    return;
  }

  alreadyScanned = true;


  const learnerId =
    String(
      decodedText || ""
    ).trim();


  if (!learnerId) {

    alreadyScanned = false;

    return;

  }


  console.log(
    "QR DETECTED:",
    learnerId
  );


  showStatus(

    "✅ QR CODE DETECTED!" +

    "<br><br>" +

    "<b>Learner ID:</b> " +

    learnerId +

    "<br><br>" +

    "⏳ Saving attendance..." ,

    "success"

  );


  stopScanner();


  sendLearnerId(
    learnerId
  );

}


/* =====================================================
   QR ERROR
===================================================== */

function onScanError(
  errorMessage
) {

  // Normal scanning errors are ignored.

}


/* =====================================================
   SEND LEARNER ID
===================================================== */

function sendLearnerId(
  learnerId
) {

  const url =

    ATTENDANCE_WEB_APP_URL +

    "?learnerId=" +

    encodeURIComponent(
      learnerId
    );


  console.log(
    "Opening Attendance URL:",
    url
  );


  showStatus(

    "✅ QR CODE READ!" +

    "<br><br>" +

    "<b>Learner ID:</b> " +

    learnerId +

    "<br><br>" +

    "⏳ Connecting to Attendance System...",

    "success"

  );


  setTimeout(

    function() {

      window.location.href = url;

    },

    700

  );

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    scanner.stop()

      .then(

        function() {

          scanning = false;

        }

      )

      .catch(

        function(error) {

          console.log(
            "Scanner stop error:",
            error
          );

          scanning = false;

        }

      );

  }

  catch (error) {

    console.log(error);

    scanning = false;

  }

}


/* =====================================================
   CLOSE
===================================================== */

function closeCamera() {

  stopScanner();

  try {

    window.close();

  }

  catch (e) {

    console.log(e);

  }

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(

  "load",

  function() {

    setTimeout(

      startCamera,

      500

    );

  }

);

</script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Talatala QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0 20px;
    }

    .instruction {
      background: #222;
      border-radius: 16px;
      padding: 22px 15px;
      margin-bottom: 18px;
      font-size: 18px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border-radius: 15px;
      overflow: hidden;
      background: black;
    }

    #status {
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background: #333;
      font-size: 17px;
      line-height: 1.5;
    }

    .success {
      background: #146c43 !important;
    }

    .error {
      background: #842029 !important;
    }

    .warning {
      background: #804d00 !important;
    }

    .processing {
      background: #084298 !important;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #dc3545;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 Talatala QR Scanner</h1>


  <div class="instruction">

    <b>LIVE CAMERA SCANNER</b>

    <br><br>

    Iharap ang cellphone camera sa QR Code ng learner.

    <br>

    Siguraduhing malinaw at nasa loob ng box ang QR Code.

  </div>


  <div id="reader"></div>


  <div id="status"
       class="processing">

    ⏳ Starting camera...

  </div>


  <button
    type="button"
    onclick="closeCamera()">

    ⛔ CLOSE CAMERA

  </button>

</div>


<script>


/* =================================================
   VARIABLES
================================================= */

let scanner = null;

let scanned = false;


/* =================================================
   GET RETURN URL
================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get(
    "returnUrl"
  );


/* =================================================
   STATUS MESSAGE
================================================= */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    type || "";

  status.innerHTML =
    message;

}


/* =================================================
   START CAMERA
================================================= */

function startCamera() {

  if (typeof Html5Qrcode === "undefined") {

    showStatus(
      "❌ QR scanner library failed to load." +
      "<br>Please check your internet connection.",
      "error"
    );

    return;
  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: function(
      width,
      height
    ) {

      const size =
        Math.min(
          width,
          height
        ) * 0.70;

      return {

        width:
          Math.floor(size),

        height:
          Math.floor(size)

      };

    }

  };


  showStatus(
    "📷 Starting cellphone camera..." +
    "<br>Please allow camera permission.",
    "processing"
  );


  scanner

    .start(

      {
        facingMode:
          "environment"
      },

      config,


      function(decodedText) {

        if (scanned) {
          return;
        }


        scanned = true;


        const learnerId =
          String(
            decodedText
          ).trim();


        console.log(
          "QR CODE:",
          learnerId
        );


        showStatus(
          "✅ QR CODE DETECTED!" +
          "<br><br>" +
          "Learner ID: <b>" +
          learnerId +
          "</b>" +
          "<br><br>" +
          "⏳ Returning to Attendance System...",
          "success"
        );


        stopScannerAndReturn(
          learnerId
        );

      },


      function(errorMessage) {

        /*
          Continuous QR scanning errors
          are normal and are ignored.
        */

      }

    )


    .then(function() {

      showStatus(
        "📷 CAMERA READY" +
        "<br><br>" +
        "Iharap ang camera sa QR Code." +
        "<br>" +
        "Ilagay ang QR Code sa loob ng box.",
        "processing"
      );

    })


    .catch(function(error) {

      console.error(
        "Camera error:",
        error
      );


      showStatus(
        "❌ HINDI MABUKSAN ANG CAMERA." +
        "<br><br>" +
        "Please allow camera permission " +
        "and try again.",
        "error"
      );

    });

}


/* =================================================
   STOP CAMERA THEN RETURN
================================================= */

function stopScannerAndReturn(
  learnerId
) {

  if (
    scanner &&
    scanner.isScanning
  ) {

    scanner
      .stop()
      .then(function() {

        returnToAttendance(
          learnerId
        );

      })

      .catch(function(error) {

        console.log(
          "Stop error:",
          error
        );

        returnToAttendance(
          learnerId
        );

      });

  }
  else {

    returnToAttendance(
      learnerId
    );

  }

}


/* =================================================
   RETURN TO ATTENDANCE SYSTEM
================================================= */

function returnToAttendance(
  learnerId
) {

  /*
    Make sure we have a valid
    Attendance Web App return URL.
  */

  if (!returnUrl) {

    showStatus(
      "❌ Walang Attendance page na nakitang return address." +
      "<br><br>" +
      "Please open the camera using the " +
      "START LIVE CAMERA button sa Attendance System.",
      "error"
    );

    return;
  }


  let destination;


  try {

    destination =
      new URL(
        returnUrl
      );


    /*
      Add the scanned Learner ID.
    */

    destination.searchParams.set(
      "learnerId",
      learnerId
    );


  }
  catch(error) {

    console.error(
      "Invalid return URL:",
      error
    );


    showStatus(
      "❌ Invalid Attendance System address.",
      "error"
    );

    return;
  }


  const finalUrl =
    destination.toString();


  console.log(
    "RETURNING TO:",
    finalUrl
  );


  /*
    BEST METHOD:
    If this camera page was opened
    as a popup, send the result to
    the original Attendance page.
  */

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.location.href =
        finalUrl;


      setTimeout(
        function() {

          window.close();

        },
        500
      );


      return;

    }

  }
  catch(error) {

    console.log(
      "Opener method failed:",
      error
    );

  }


  /*
    FALLBACK METHOD:
    If cellphone browser/Messenger
    does not provide window.opener,
    directly redirect to Attendance.
  */

  window.location.href =
    finalUrl;

}


/* =================================================
   CLOSE CAMERA
================================================= */

function closeCamera() {

  if (
    scanner &&
    scanner.isScanning
  ) {

    scanner
      .stop()
      .then(function() {

        window.close();

      })

      .catch(function() {

        window.close();

      });

  }
  else {

    window.close();

  }

}


/* =================================================
   START WHEN PAGE LOADS
================================================= */

window.addEventListener(
  "load",
  function() {

    startCamera();

  }
);


</script>

</body>
</html>
